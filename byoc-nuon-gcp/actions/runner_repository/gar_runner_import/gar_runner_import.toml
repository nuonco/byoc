# action
# Imports runner image tags from the upstream Nuon public registry into the
# install's own Artifact Registry runner repository (component:
# runner_repository), so runners can pull from the install's repo directly.
name    = "gar_runner_import"
labels  = { service = "runner-repository", type = "sop" }
label   = "gcp"
timeout = "10m"

[[triggers]]
type = "manual"

[[steps]]
name            = "import"
inline_contents = "./runner_repository/gar_runner_import/import.sh"

[steps.env_vars]
# SOURCE_IMAGE_URL is hardcoded to the upstream public ecr repo in the script.
RUNNER_REPOSITORY_URI = "{{ .nuon.components.runner_repository.outputs.runner_repository.repository_uri }}"
OVERRIDE              = "false"
