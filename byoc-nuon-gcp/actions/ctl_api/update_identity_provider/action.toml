# action
# description: Renames, enables/disables, or changes the access policy of an
# existing identity provider. Disabling removes its sign-in button while leaving
# linked accounts intact, so re-enabling restores access. Identify it by
# IDENTITY_PROVIDER_ID or CLIENT_ID.
name    = "ctl_api_update_identity_provider"
labels  = { service = "auth", type = "sop" }
timeout = "5m"

[[triggers]]
type = "manual"

[[steps]]
name            = "exec"
inline_contents = "./ctl_api/update_identity_provider/action.sh"

[steps.env_vars]
ADMIN_API_URL = "http://admin.{{ .nuon.sandbox.outputs.nuon_dns.internal_domain.name }}"

# identify the provider by one of these
IDENTITY_PROVIDER_ID = ""
CLIENT_ID            = ""

# only the values you set are sent
PROVIDER_NAME   = ""
ENABLED         = ""
ALLOW_ALL_USERS = ""
