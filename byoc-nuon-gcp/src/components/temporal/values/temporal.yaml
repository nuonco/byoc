---
fullnameOverride: temporal

cassandra:
  enabled: false
elasticsearch:
  enabled: false
grafana:
  enabled: false
mysql:
  enabled: false
postgresql:
  enabled: true
prometheus:
  enabled: false

schema:
  setup:
    enabled: false
  update:
    enabled: false

server:
  replicaCount: 5
  nodeSelector:
    pool.nuon.co: temporal
  tolerations:
    - key: pool.nuon.co
      operator: Equal
      value: temporal
      effect: NoSchedule
  frontend:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: frontend
      - maxSkew: 2
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: frontend
  history:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: history
      - maxSkew: 2
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: history
  matching:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: matching
      - maxSkew: 2
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: matching
  worker:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: worker
      - maxSkew: 2
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: worker
  dynamicConfig:
    limit.historySize.error:
      - value: 209715200
    limit.blobSize.error:
      - value: 5242880
      
    frontend.namespaceRPS:
      - value: 15000
        constraints: {}
    frontend.maxNamespaceRPSPerInstance:
      - value: 5000
        constraints: {}
    
    matching.rps:
      - value: 15000
        constraints: {}
    matching.persistenceMaxQPS:
      - value: 5000
        constraints: {}
    matching.persistenceNamespaceMaxQPS:
      - value: 5000
        constraints: {}
    matching.persistenceMaxQPSPerInstance:
      - value: 10000
        constraints: {}
    
    history.persistenceMaxQPS:
      - value: 10000
        constraints: {}
    history.rps:
      - value: 40000
        constraints: {}
    history.namespaceRPS:
      - value: 40000
        constraints: {}
    history.maxNamespaceRPSPerInstance:
      - value: 20000
        constraints: {}
  config:
    prometheus:
      framework: opentelemetry
      listenAddress: "0.0.0.0:9090"
    persistence:
      default:
        driver: sql
        sql:
          database: temporal
          driver: postgres12
          maxConnLifetime: 1h
          maxConns: 40
          maxIdleConns: 20
          maxQPS: 10000
          # CloudSQL enforces ssl_mode=ENCRYPTED_ONLY; host verification stays
          # off because the per-instance Google CA isn't in the trust store.
          tls:
            enabled: true
            enableHostVerification: false
      visibility:
        driver: sql
        sql:
          database: temporal_visibility
          driver: postgres12
          maxConnLifetime: 1h
          maxConns: 40
          maxIdleConns: 20
          maxQPS: 10000
          tls:
            enabled: true
            enableHostVerification: false

admintools:
  nodeSelector:
    pool.nuon.co: temporal
  tolerations:
    - key: pool.nuon.co
      operator: Equal
      value: temporal
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
          app.kubernetes.io/component: admintools
    - maxSkew: 2
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
          app.kubernetes.io/component: admintools

web:
  nodeSelector:
    pool.nuon.co: temporal
  tolerations:
    - key: pool.nuon.co
      operator: Equal
      value: temporal
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
          app.kubernetes.io/component: web
    - maxSkew: 2
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
          app.kubernetes.io/component: web
