name         = "dashboard_ui_version"
description  = "Pin the dashboard-ui image version deployed to this install, e.g. 0.19.1162. Updating this input redeploys the dashboard_ui chart on its own. Must be a version already synced into the install's registry. Leave empty to track the version pinned in the byoc app config."
default      = ""
display_name = "Dashboard UI Version"
required     = false
group        = "nuon"
type         = "string"

user_configurable = false
