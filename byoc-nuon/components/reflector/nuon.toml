# helm
#
# Emberstack Reflector. Mirrors secrets and configmaps between namespaces based on
# annotations on the source object.
#
# Needed because Strimzi writes its mTLS cert secrets into the kafka namespace
# while ctl-api runs in its own, and Kubernetes secrets do not cross namespaces.
# The annotations that drive it are set on the Kafka CR and KafkaUser templates in
# the kafka_cluster component, not here.
#
# Cluster-wide by design, matching how mono installs it in infra/eks. Nothing else
# depends on it today, so it is safe to install ahead of Kafka.
name           = "reflector"
type           = "helm_chart"
chart_name     = "reflector"
namespace      = "reflector"
storage_driver = "configmap"

# Pulled from the upstream helm repo rather than a git ref: emberstack/helm-charts
# tags releases as v1.0.x at the repo level, so there is no reflector-<version> ref
# to pin. Chart version tracks appVersion, so this matches the image tag on
# img_emberstack_reflector -- keep the two in step.
[helm_repo]
repo_url = "https://emberstack.github.io/helm-charts"
chart    = "reflector"
version  = "10.0.51"

[[values_file]]
contents = "./values/reflector.yaml"
