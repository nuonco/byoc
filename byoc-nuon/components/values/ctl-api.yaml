---
environment: prod
gcp:
  enabled: false

env:
  ENV: prod
  LOG_LEVEL: INFO
  MIDDLEWARES: tracer,public_metrics,error,public,size,global,auth,org,log,offset_pagination,invites,headers,cors,config,patcher,panicker
  RUNNER_MIDDLEWARES: tracer,runner_metrics,error,size,public,auth,runner_org,log,offset_pagination,headers,cors,config,patcher,panicker
  INTERNAL_MIDDLEWARES: tracer,internal_metrics,error,size,public,log,global,config,admin,offset_pagination,cors,config,patcher,panicker
  GIN_MODE: "release"

  DB_HOST: "{{ .nuon.components.rds_cluster_nuon.outputs.address }}"
  DB_REPLICA_HOST: "{{ .nuon.components.rds_cluster_nuon.outputs.address }}"
  DB_NAME: "ctl_api"      # hardcoded, for now - also, main db not the desired db we created
  DB_USER: "ctl_api"      # hardcoded, for now - also, main user, not the user we create
  DB_USE_SSL: "true"
  DB_SSL_MODE: verify-full
  DB_USE_ZAP: "true"
  DB_USE_IAM: "true"
  DB_MIGRATIONS_PATH: /migrations
  DB_REGION: "{{ .nuon.install_stack.outputs.region }}"  # NOTE(fd): this assumes the db and deployment are in the same region
  APP_REGION: "{{ .nuon.install_stack.outputs.region }}" # NOTE(fd): can app region and db region ever be different?

  ROOT_DOMAIN: "{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}"


  # Auth0 config
  # NOTE: with the advent of Nuon Auth, these are not strictly required. We are momentarily setting non-empty values until
  # we refactor the services configs wholesale.
  AUTH0_ISSUER_URL: '{{ dig "inputs" "auth_issuer_url" "dne" .nuon.inputs }}'
  AUTH0_AUDIENCE: '{{ dig "inputs" "auth_audience" "dne" .nuon.inputs }}'
  AUTH0_CLIENT_ID: '{{ dig "inputs" "auth_client_id_ctl_api" "dne" .nuon.inputs }}'

  # OIDC config
  NUON_AUTH_PROVIDER_TYPE: "{{ .nuon.inputs.inputs.nuon_auth_provider_type }}"
  NUON_AUTH_CLIENT_ID: '{{ or .nuon.inputs.inputs.nuon_auth_client_id "nuon_auth_client_id" }}'
  NUON_AUTH_ISSUER_URL: '{{ or .nuon.inputs.inputs.nuon_auth_issuer_url "nuon_auth_issuer_url" }}'
  NUON_AUTH_REDIRECT_URL: "https://auth.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}/auth"
  # nuon_access_enabled appends nuon.co declaratively so it survives re-renders
  # (the nuon_access_enable runbook's configmap patch alone is reverted by any
  # input sync) and turns off cleanly when the input is set back to false.
  NUON_AUTH_ALLOWED_DOMAINS: '{{ or .nuon.inputs.inputs.nuon_auth_allowed_domains "" }}{{ if eq (or .nuon.inputs.inputs.nuon_access_enabled "false") "true" }},nuon.co{{ end }}'
  NUON_AUTH_ALLOW_ALL_USERS: '{{ or .nuon.inputs.inputs.nuon_auth_allow_all_users "false" }}'

  EVALUATION_JOURNEY_ENABLED: "false"

  CLICKHOUSE_DB_PORT: !!string 9000
  CLICKHOUSE_DB_USE_TLS: "false"
  CLICKHOUSE_DB_HOST: "{{ .nuon.components.clickhouse_cluster.outputs.service }}"
  CLICKHOUSE_DB_NAME: "ctl_api"
  CLICKHOUSE_DB_USER: clickhouse

  # Kafka is provisioned but not yet carrying traffic. While KAFKA_ENABLED is false
  # the producer no-ops and every path it fronts — heartbeats, otel log records and
  # otel trace spans — takes its legacy inline ClickHouse write. The consumers below
  # no-op too: their pods run and report healthy, holding no partitions, until this
  # flips.
  #
  # Flipping this to "true" is a deliberate, separate change. Before doing it, note
  # that the heartbeat produce is fire-and-forget: a broker outage drops heartbeats
  # rather than falling back, and a runner with no recent heartbeats is marked
  # offline by the health cron and stops accepting jobs. Alert on
  # kafka.producer.message_count{status:err,reason:broker_error} first.
  #
  # This is NOT what gates the cert mounts — those are unconditional in the chart and
  # safe while the secrets do not exist yet, so a mirroring failure surfaces now
  # rather than at cutover.
  KAFKA_ENABLED: "false"
  # Strimzi derives this from the Kafka CR name, so it is the same in every install —
  # hardcoded rather than read from the kafka_cluster component's outputs.
  KAFKA_BROKERS: nuon-kafka-bootstrap.kafka.svc.cluster.local:9093
  # SSL, not SASL_SSL — mTLS is not a SASL mechanism.
  KAFKA_SECURITY_PROTOCOL: SSL
  KAFKA_TLS_CA_PATH: /etc/kafka/certs/ca/ca.crt
  KAFKA_TLS_CERT_PATH: /etc/kafka/certs/user/user.crt
  KAFKA_TLS_KEY_PATH: /etc/kafka/certs/user/user.key

  HTTP_PORT: !!string 8081
  INTERNAL_HTTP_PORT: !!string 8082
  RUNNER_HTTP_PORT: !!string 8083
  GRACEFUL_SHUTDOWN_TIMEOUT: 10s
  RUNNER_CONTAINER_IMAGE_TAG: "0.19.1126"
  RUNNER_CONTAINER_IMAGE_URL: "{{ .nuon.inputs.inputs.runner_image_url }}"

  GITHUB_APP_ID: !!string {{ .nuon.inputs.inputs.github_app_id }}

  INTEGRATION_GITHUB_INSTALL_ID: !!string 00000000

  # Slack app config — empty values disable the Slack integration
  SLACK_HTTP_PORT: !!string 8089
  SLACK_MIDDLEWARES: "tracer,public_metrics,error,size,log,headers,cors,config,panicker"
  SLACK_CLIENT_ID: '{{ or .nuon.inputs.inputs.slack_client_id "" }}'
  SLACK_OAUTH_REDIRECT_URL: '{{ or .nuon.inputs.inputs.slack_oauth_redirect_url "" }}'


  INTERNAL_SLACK_WEBHOOK_URL: |-
    https://hooks.slack.com/services/xxxxxxxxxxx/xxxxxxxxxxx/xxxxxxxxxxxxxxxxxxxxxxxx

  AWS_CLOUDFORMATION_STACK_TEMPLATE_BASE_URL: "{{ .nuon.components.s3_buckets.outputs.install_template_bucket.base_url }}"
  AWS_CLOUDFORMATION_STACK_TEMPLATE_BUCKET: "{{ .nuon.components.s3_buckets.outputs.install_template_bucket.id }}"
  AWS_CLOUDFORMATION_STACK_TEMPLATE_BUCKET_REGION: "{{ .nuon.components.s3_buckets.outputs.install_template_bucket.region }}"

  APP_URL: https://app.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}
  PUBLIC_API_URL: https://api.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}
  RUNNER_API_URL: https://runner.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}
  ADMIN_API_URL: https://admin.{{ .nuon.sandbox.outputs.nuon_dns.internal_domain.name }}

  # TODO: sort out tailscale for the ui and admin api
  TEMPORAL_HOST: temporal-frontend-headless.temporal.svc.cluster.local:7233
  TEMPORAL_MAX_CONCURRENT_ACTIVITIES: !!string 3500
  TEMPORAL_STICKY_WORKFLOW_CACHE_SIZE: !!string 10000
  # served via the dashboard-ui proxy; a cluster-internal URL breaks the browser link
  TEMPORAL_UI_URL: https://app.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}/admin/temporal
  SANDBOX_MODE_SLEEP: 1s

  BLOB_STORAGE_BUCKET: "{{ .nuon.components.s3_buckets.outputs.blob_bucket.id }}"
  BLOB_STORAGE_REGION: "{{ .nuon.components.s3_buckets.outputs.blob_bucket.region }}"

  # NOTE: deprecated or not in use in byoc
  SEGMENT_WRITE_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  LOOPS_API_KEY: "{{ .nuon.inputs.inputs.loops_api_key }}"

  # NOTE: from management component (mostly)
  MANAGEMENT_ACCOUNT_ID: "{{ .nuon.components.management.outputs.management_account_id }}"
  MANAGEMENT_ECR_REGISTRY_ARN: "arn:aws:ecr:{{ .nuon.install_stack.outputs.region }}:{{ .nuon.install_stack.outputs.account_id }}:repository"
  MANAGEMENT_ECR_REGISTRY_ID: "{{ .nuon.components.management.outputs.ecr.id }}"
  MANAGEMENT_IAM_ROLE_ARN: "{{ .nuon.components.management.outputs.org_access_role.iam_role_arn }}"

  DNS_MANAGEMENT_IAM_ROLE_ARN: "{{ .nuon.components.management.outputs.dns_management_role_arn }}"
  DNS_ROOT_DOMAIN: "{{ .nuon.components.management.outputs.route53_zone.domain }}"
  DNS_ZONE_ID: "{{ .nuon.components.management.outputs.route53_zone.zone_id }}"

  ORG_RUNNER_K8S_CA_DATA: "{{ .nuon.components.management.outputs.cluster.certificate_authority_data }}"
  ORG_RUNNER_K8S_CLUSTER_ID: "{{ .nuon.components.management.outputs.cluster.name }}"
  ORG_RUNNER_K8S_IAM_ROLE_ARN: "{{ .nuon.components.ctl_api_role.outputs.iam_role_arn }}"
  ORG_RUNNER_K8S_PUBLIC_ENDPOINT: "{{ .nuon.components.management.outputs.cluster.endpoint }}"
  ORG_RUNNER_OIDC_PROVIDER_ARN: "{{ .nuon.components.management.outputs.cluster.oidc_provider_arn }}"
  ORG_RUNNER_OIDC_PROVIDER_URL: "{{ .nuon.components.management.outputs.cluster.oidc_provider }}" # TODO: rename to drop the URL
  ORG_RUNNER_REGION: "{{ .nuon.install_stack.outputs.region }}"
  ORG_RUNNER_K8S_USE_DEFAULT_CREDS: !!string true

  ORG_RUNNER_SUPPORT_ROLE_ARN: "arn:aws:iam::814326426574:role/nuon-internal-support-prod"
  RUNNER_DEFAULT_SUPPORT_IAM_ROLE_ARN: "arn:aws:iam::814326426574:role/nuon-internal-support-prod"

  TEMPORAL_WORKFLOW_FAILURE_PANIC: "true"

  # queues management
  QUEUE_CONTINUE_AS_NEW_HINT_PERIOD: 5m
  QUEUE_CONTINUE_AS_NEW_HISTORY_MAX: "1500"
  QUEUE_SIGNAL_CLEANUP_ENABLED: "true"

  OIDC_FEDERATION_ENABLED: '{{ or .nuon.inputs.inputs.oidc_federation_enabled "false" }}'

envSecrets:
  - name: "GITHUB_APP_KEY"
    valueFrom:
      name: github-app-key
      key: value
  - name: "CLICKHOUSE_DB_PASSWORD"
    valueFrom:
      name: clickhouse-cluster-pw
      key: value
  - name: "SLACK_CLIENT_SECRET"
    optional: true
    valueFrom:
      name: ctl-api-slack-client-secret
      key: value
  - name: "SLACK_SIGNING_SECRET"
    optional: true
    valueFrom:
      name: ctl-api-slack-signing-secret
      key: value
  - name: "SLACK_STATE_JWT_SECRET"
    optional: true
    valueFrom:
      name: ctl-api-slack-state-jwt-secret
      key: value

image:
  repository: "{{ .nuon.components.img_nuon_ctl_api.outputs.image.repository }}"
  tag: "{{ .nuon.components.img_nuon_ctl_api.outputs.image.tag }}"

# mTLS certs, mirrored into this namespace from the kafka namespace by Reflector and
# mounted into every pod that produces or consumes. Both are mounted optional, so
# they are inert until the kafka_cluster component has run and Reflector has copied
# them across.
kafka:
  certs:
    caSecret: nuon-cluster-ca-cert
    userSecret: ctl-api

# Kafka consumer deployments, named for what they consume rather than where they
# write. Each gets its own consumer group (ctl-api-consumer-<name>), so a restart of
# one does not rebalance the others.
#
# A deployment is not necessarily one consumer — `--name` takes a list. What drives
# the split is whether they have anything in common operationally:
#
#   - heartbeats stays alone. It is a trickle that feeds runner liveness, while otel
#     ingest is bursty and bulky; sharing a pod means a log-volume spike OOMs the pod
#     heartbeats depend on, which surfaces as runners being marked offline.
#   - otel-logs and otel-traces share the otel deployment. Same producers, same shape
#     of payload, and no case where we would scale span ingest without log ingest.
#   - dlq stays alone because it is near-idle and should not inherit anyone else's
#     restarts.
#
# requests == limits for Guaranteed QoS, same reasoning as the brokers: a throttled
# consumer just accrues lag, which is quieter and easier to miss than a crash.
consumer:
  nodeSelector:
    pool.nuon.co: ctl-api-consumer
  tolerations:
    - key: "pool.nuon.co"
      operator: "Equal"
      value: ctl-api-consumer
      effect: "NoSchedule"
  # ScheduleAnyway, not DoNotSchedule: a consumer that cannot schedule accrues lag,
  # which is worse than uneven placement.
  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 2
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: ScheduleAnyway
  autoscaling:
    targetCPUUtilizationPercentage: 75
  instances:
    # Replicas are static: 8 topic partitions / 4 replicas is an even 2 each, so no
    # pod holds double. The HPA is pinned min == max, so nothing autoscales yet.
    - name: heartbeats
      replicas: 4
      command: ["/bin/service", "consumer", "--name=heartbeats"]
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Both OTel sinks, deliberately co-located. Consumer groups stay separate
    # (ctl-api-consumer-otel-logs, ctl-api-consumer-otel-traces), so this is one pod
    # running two independent clients, not one group straddling two topics —
    # renaming the deployment does not reset either group's offsets.
    #
    # 1Gi because fetch memory is bounded per client by partitions-per-pod, and this
    # pod runs two clients. The headroom over that is for decode: spans carry three
    # attribute maps plus nested events and links. Those caps are the only bound on
    # buffered memory, so if RSS climbs the lever is tightening them (or adding
    # replicas, which shrinks partitions-per-pod), not raising this limit.
    - name: otel
      replicas: 4
      command: ["/bin/service", "consumer", "--name=otel-logs,otel-traces"]
      resources:
        requests:
          cpu: 1000m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 1Gi
      extraEnv:
        # franz-go defaults to 50MiB per broker with unbounded fetch concurrency,
        # which on 3 brokers buffers ~150MiB of lz4-compressed records before decode.
        # Capped explicitly; fetch_min_bytes stays well under these, so steady-state
        # batching and latency are unchanged and the caps only bite during a drain.
        - name: KAFKA_CONSUMER_FETCH_MAX_BYTES
          value: "8388608"
        - name: KAFKA_CONSUMER_FETCH_MAX_PARTITION_BYTES
          value: "2097152"
        - name: KAFKA_CONSUMER_MAX_CONCURRENT_FETCHES
          value: "2"

    # Drains the shared dead-letter topic into the same ClickHouse table the other
    # consumers write to directly if a produce fails. Should stay near-idle —
    # replicas are for availability, not throughput.
    - name: dlq
      replicas: 2
      command: ["/bin/service", "consumer", "--name=dlq"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi

worker:
  nodeSelector:
    pool.nuon.co: ctl-api-worker
  tolerations:
    - key: "pool.nuon.co"
      operator: "Equal"
      value: ctl-api-worker
      effect: "NoSchedule"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 2
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: ScheduleAnyway
  instances:
    - namespace: orgs
      minReplicas: 2
      maxReplicas: 2
      command: ["/bin/service", "worker", "--namespace=orgs"]
    - namespace: actions
      minReplicas: 2
      maxReplicas: 2
      command: ["/bin/service", "worker", "--namespace=actions"]
    - namespace: apps
      minReplicas: 2
      maxReplicas: 2
      command: ["/bin/service", "worker", "--namespace=apps"]
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
      extraEnv:
        - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_EXECUTION_SIZE
          value: "10000"
        - name: TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLERS
          value: "50"
        - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_POLLERS
          value: "50"
        - name: DB_MAX_CONNECTIONS
          value: "10"
        - name: TEMPORAL_STICKY_WORKFLOW_CACHE_SIZE
          value: "1000000"
    - namespace: components
      minReplicas: 2
      maxReplicas: 2
      command: ["/bin/service", "worker", "--namespace=components"]
      resources:
        requests:
          cpu: 1000m
          memory: 1Gi
    - namespace: installs
      minReplicas: 4
      maxReplicas: 4
      command: ["/bin/service", "worker", "--namespace=installs"]
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
      extraEnv:
        - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_EXECUTION_SIZE
          value: "10000"
        - name: TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLERS
          value: "100"
        - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_POLLERS
          value: "100"
        - name: DB_MAX_CONNECTIONS
          value: "10"
        - name: TEMPORAL_STICKY_WORKFLOW_CACHE_SIZE
          value: "1000000"
    - namespace: releases
      minReplicas: 2
      maxReplicas: 2
      command: ["/bin/service", "worker", "--namespace=releases"]
    - namespace: general
      minReplicas: 2
      maxReplicas: 2
      command: ["/bin/service", "worker", "--namespace=general"]
      extraEnv:
        - name: TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLERS
          value: "200"
        - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_POLLERS
          value: "50"
    - namespace: runners
      minReplicas: 4
      maxReplicas: 6
      command: ["/bin/service", "worker", "--namespace=runners"]
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
      extraEnv:
        - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_EXECUTION_SIZE
          value: "10000"
        - name: TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLERS
          value: "200"
        - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_POLLERS
          value: "100"
        - name: DB_MAX_CONNECTIONS
          value: "15"
        - name: TEMPORAL_STICKY_WORKFLOW_CACHE_SIZE
          value: "100000"
  autoscaling:
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  # topology spread
  minDomains: 2

api:
  nodeSelector:
    pool.nuon.co: "public"
  tolerations:
    - key: "pool.nuon.co"
      operator: "Equal"
      value: "public"
      effect: "NoSchedule"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 2
      minDomains: 3
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
  liveness_probe: /livez
  readiness_probe: /readyz

  resources:
    requests:
      cpu: 500m
      memory: 512Mi

  public:
    port: 8081
    domain: "api.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}"
    domain_certificate: "{{ .nuon.components.certificate_wildcard_public.outputs.public_domain_certificate_arn }}"
    autoscaling:
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
  admin:
    port: 8082
    domain: "admin.{{ .nuon.sandbox.outputs.nuon_dns.internal_domain.name }}"
    autoscaling:
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  dashboard_admin:
    enabled: {{ or .nuon.inputs.inputs.admin_dashboard_enabled "false" }}
    port: 8087
    alb:
      enabled: {{ or .nuon.inputs.inputs.admin_dashboard_alb_enabled "false" }}
      domain: "admin.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}"
      domain_certificate: "{{ .nuon.components.certificate_wildcard_public.outputs.public_domain_certificate_arn }}"
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  runner:
    port: 8083
    domain: "runner.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}"
    domain_certificate: "{{ .nuon.components.certificate_wildcard_public.outputs.public_domain_certificate_arn }}"
    autoscaling:
      minReplicas: 4
      maxReplicas: 10
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  auth:
    port: 8084
    domain: "auth.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}"
    domain_certificate: "{{ .nuon.components.certificate_wildcard_public.outputs.public_domain_certificate_arn }}"
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  slack:
    enabled: {{ or .nuon.inputs.inputs.slack_enabled "false" }}
    port: 8089
    domain: "slack.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}"
    domain_certificate: "{{ .nuon.components.certificate_wildcard_public.outputs.public_domain_certificate_arn }}"

  # topology spread
  minDomains: 2

  # TODO: these should actually match the zones the Nuon RDS Cluster is in to reduce latencey
  # AZs come from the sandbox VPC output rather than being derived from the
  # region, since the actual AZs can differ across sandboxes.
  zones:
  {{- range .nuon.sandbox.outputs.vpc.azs }}
    - "{{ . }}"
  {{- end }}

# auth-specific secrets (in addition to the shared envSecrets)
auth:
  enabled: {{ if or (eq "google" .nuon.inputs.inputs.nuon_auth_provider_type) (eq "oidc" .nuon.inputs.inputs.nuon_auth_provider_type) }}true{{ else }}false{{ end }}
  envSecrets:
    - name: "NUON_AUTH_CLIENT_SECRET"
      valueFrom:
        name: ctl-api-auth-client-secret
        key: value
    - name: "NUON_AUTH_SESSION_KEY"
      valueFrom:
        name: ctl-api-auth-session-key
        key: value


serviceAccount:
  name: ctl-api
  annotations:
    eks.amazonaws.com/role-arn: "{{ .nuon.components.ctl_api_role.outputs.iam_role_arn }}"
