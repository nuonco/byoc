# helm
name           = "ctl_api"
type           = "helm_chart"
chart_name     = "ctl-api"
namespace      = "ctl-api"
storage_driver = "configmap"
deploy_timeout = "1h"
dependencies   = ["rds_cluster_nuon", "karpenter_nodepools", "clickhouse_cluster", "temporal", "management", "ctl_api_init_db"]

[public_repo]
repo      = "nuonco/charts"
directory = "charts/ctl-api"
# TEMP: the Kafka cert mounts and consumer deployments land in chart 0.6.0.
# Revert to a tagged release (ctl-api-v0.6.0) once nuonco/charts#<pr> merges.
branch    = "ey/ctl-api-kafka"

[[values_file]]
contents = "./values/ctl-api.yaml"
