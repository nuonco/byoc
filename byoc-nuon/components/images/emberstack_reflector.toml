# container-image
#
# Emberstack Reflector, which mirrors the Strimzi mTLS cert secrets from the
# kafka namespace into ctl-api's. Kubernetes secrets do not cross namespaces, and
# the alternative — widening the operator's watchNamespaces — has a much larger
# blast radius.
name   = "img_emberstack_reflector"
type   = "container_image"

# Matches the version mono runs (infra/eks/reflector.tf), deliberately: the
# reflection annotations are the same ones our infra already relies on.
#
# Pulled from docker.io, not ghcr, because ghcr does not carry this tag -- mono
# gets it from our ECR mirror, which a customer account cannot reach. Docker Hub
# is the chart's own default registry and has it. Rate limits are not a concern:
# this is pulled once at build time and mirrored into the install's registry.
#
# Keep in step with the reflector chart version, which tracks appVersion.
[public]
image_url = "docker.io/emberstack/kubernetes-reflector"
tag       = "7.1.210"
