# terraform
name              = "ctl_api_role"
type              = "terraform_module"
terraform_version = "1.11.3"

[public_repo]
repo      = "nuonco/byoc"
directory = "byoc-nuon/components/ctl_api_role"
# TEMP: carries the scoped sts:AssumeRole fix. Revert to main once #1053 merges.
branch    = "ey/fix-ctl-api-role-assume-role-scope"

[vars]
install_id              = "{{ .nuon.install.id }}"
region                  = "{{ .nuon.install_stack.outputs.region }}"
cluster_name            = "{{ .nuon.install.sandbox.outputs.cluster.name }}"
db_instance_resource_id = "{{ .nuon.components.rds_cluster_nuon.outputs.db_instance_resource_id }}"

[[operation_roles]]
operation = "deploy"
role      = "{{.nuon.install.id}}-provision"

[[operation_roles]]
operation = "teardown"
role      = "{{.nuon.install.id}}-deprovision"
