# action
# description: Adds an identity provider, or updates the one with a matching
# client_id. The provider config (including the client secret) is read from AWS
# Secrets Manager at runtime -- action env vars are persisted on the run and shown
# in the dashboard, so secrets must not be passed as inputs. redirect_url is
# templated from this install's DNS so it follows a root_domain change.
name    = "ctl_api_add_identity_provider"
labels  = { service = "auth", type = "sop" }
timeout = "5m"

[[triggers]]
type = "manual"

[[steps]]
name            = "exec"
inline_contents = "./ctl_api/add_identity_provider/action.sh"

[steps.env_vars]
ADMIN_API_URL = "http://admin.{{ .nuon.sandbox.outputs.nuon_dns.internal_domain.name }}"
REDIRECT_URL  = "https://auth.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}/auth"

# AWS installs read the secret with their own maintenance role; no federation needed

# ARN of the secret holding the provider config
PROVIDER_SECRET_ARN = ""
ENABLED             = "true"
# empty inherits nuon_auth_allow_all_users; "true"/"false" overrides it here only
ALLOW_ALL_USERS     = ""
