# action
# description: Lists the identity providers this control plane will accept
# sign-ins from — both the one configured through NUON_AUTH_* env vars (source
# "env") and any configured in the database. Read-only.
name    = "ctl_api_get_identity_providers"
labels  = { service = "auth", type = "sop" }
timeout = "1m"

[[triggers]]
type = "manual"

[[steps]]
name            = "exec"
inline_contents = "./ctl_api/get_identity_providers/action.sh"

[steps.env_vars]
ADMIN_API_URL = "http://admin.{{ .nuon.sandbox.outputs.nuon_dns.internal_domain.name }}"
