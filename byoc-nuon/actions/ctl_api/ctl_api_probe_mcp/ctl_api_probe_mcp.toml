# action
# description: per-endpoint health probe for the ctl-api MCP API
# (mcp.<public_domain>, https, internet-facing ALB). Reachability + DNS +
# ingress/ALB. Read-only, kubectl/curl only.
name    = "ctl_api_probe_mcp"
labels  = { service = "ctl-api", type = "debug" }
timeout = "5m"

[[triggers]]
type = "manual"

[[steps]]
name            = "Probe ctl-api mcp endpoint"
inline_contents = "./ctl_api/api_probe/endpoint_probe.sh"

[steps.env_vars]
NAMESPACE    = "ctl-api"
INGRESS_NAME = "ctl-api-mcp"
HOSTNAME     = "mcp.{{ .nuon.sandbox.outputs.nuon_dns.public_domain.name }}"
ZONE         = "public"
SCHEME       = "https"
HEALTH_PATH  = "/readyz"
